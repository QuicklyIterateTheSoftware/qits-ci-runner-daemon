archetype: java-service
artifacts:
  # THE RUNNER IS AN IMAGE, and only an image: on every host it runs as a container started from
  # this tag (the install script qits-ci renders `docker run`s it; a runner rolls itself over by
  # starting a successor from the next tag). The static native binary is still built — it is what
  # the image carries — but it is no artifact of its own, and nothing downloads it.
  #
  # The document is the ci-runner module's CycloneDX, from the same build as the image: the reactor
  # resolve that produced the binary inside it.
  - { type: docker, name: qits/qits-ci-runner, sbom: out/sbom.json }
  # THE PIN AND THE PROTOCOL, IN ONE JAR — qits-ci-daemon's arrangement, for the same reason.
  # `ci-runner-protocol` is the wire contract qits-ci and the runner both speak, and it carries
  # `CiRunnerBinary.VERSION`, filtered from `${project.version}` at build time, so the jar's version
  # IS the tag of the image published beside it. qits-ci pins this coordinate in its pom and renders
  # the install script's image, and every Upgrade's, from the constant.
  #
  # qits-ci submits this `sbom:` from whichever release step holds the file — the maven step below,
  # where `makeBom` writes it — and checks on the last step that it reached the store.
  - { type: maven, name: "eu.wohlben.qits:qits-ci-runner-protocol", path: ci-runner-protocol, sbom: ci-runner-protocol/target/sbom.json }

# AN IMAGE AND A JAR FROM ONE TREE, WHICH NO ARCHETYPE PUBLISHES — the shape of qits-workspace-daemon
# and qits-projects-daemon, which name `java-service` for the family and declare both slots
# themselves, as this file does. It used to ride `daemon`, whose recipe publishes one bare binary;
# with the binary no longer an artifact that archetype describes nothing here, and qits-ci only
# composes an archetype's slot where the repository declares none, so with both declared below the
# name is the family and nothing more.
#
# THIS FILE CANNOT BOOTSTRAP ITSELF. The publish run is composed from `main` and the gate reads the
# tag, so on a repository whose `main` has never carried a release.yml the first release has nothing
# to compose from. A person lands this file on `main` by hand once; every later change to it rides a
# release request like any other.
#
# THE QA HALF, for three things a compile does not do: the JVM suite; a smoke of the BUILT IMAGE —
# loaded into the step's docker and run twice, once asked for its version (it must print the tree's)
# and once with no environment at all (it must refuse, exit 2) — which needs a docker socket, hence
# `docker: true`; and the install-script contract test, which runs this repository's reference
# rendering of the script qits-ci serves against a stub docker and needs nothing but a shell.
release-request:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # THE ADDRESS IS CODE (qits-731): Maven Central through qits-mirror's cache. `wohlben.eu`
      # covers a qits-ci too old to inject $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      export QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify

  - image: qits/build-images/ci-base:latest
    docker: true
    timeout-seconds: 3600
    script: |
      # THE ADDRESSES ARE CODE (qits-731): the registry is registry.qits.<domain>, the hosted maven
      # repository and the mirror's Central constant paths under it and mirror.qits.<domain>.
      # `wohlben.eu` covers a qits-ci too old to inject $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      maven_root="https://registry.qits.$qits_domain/artifacts/maven/maven"
      musl_url=$(sed -n 's/^ARG MUSL_URL=//p' docker/Dockerfile.musl-builder)
      zlib_url=$(sed -n 's/^ARG ZLIB_URL=//p' docker/Dockerfile.musl-builder)
      : "${musl_url:?docker/Dockerfile.musl-builder declares no ARG MUSL_URL}"
      : "${zlib_url:?docker/Dockerfile.musl-builder declares no ARG ZLIB_URL}"
      musl_url="$maven_root${musl_url#*/artifacts/maven/maven}"
      zlib_url="$maven_root${zlib_url#*/artifacts/maven/maven}"
      # ON THE EDGE PLANE THE TARBALL `ADD` NEEDS THE RUN'S TOKEN (qits-441): there $maven_root is
      # the public registry, which answers an anonymous read 401. BuildKit's HTTP source sends a
      # session secret named HTTP_AUTH_TOKEN_<url host> as `Authorization: Bearer`, so the secret is
      # keyed by exactly that host and passed only when the step holds $QITS_TOKEN, which qits-ci
      # sets on the EDGE plane alone. On the INTERNAL plane nothing is passed and the in-network read
      # stays anonymous, as qits-ci intends. docker/Dockerfile.musl-builder's header has the
      # long form.
      #
      # THE MAVEN STAGE'S CREDENTIAL IS UNCONDITIONAL, unlike the tarball's: the two files qits-ci's
      # prelude writes become QITS_MAVEN_AUTH_USR/PSW inside the mvnw RUN (docker/Dockerfile) — the
      # run's token on the EDGE plane, where the public mirror challenges, and the commissioned pair
      # on the INTERNAL one, where the in-network mirror never does, so Maven never sends it.
      tarball_auth=
      if [ -n "${QITS_TOKEN:-}" ]; then
        tarball_host=$(printf '%s\n' "$maven_root" | sed -E 's|^[A-Za-z]+://||; s|[/:?].*$||')
        tarball_auth="--secret id=HTTP_AUTH_TOKEN_$tarball_host,env=QITS_TOKEN"
      fi
      # THE TOOLCHAIN TAG IS A HASH OF ITS INPUTS, NOT qits-ci-daemon's BARE `jdk-25`. Two
      # repositories now carry a copy of docker/Dockerfile.musl-builder, and a shared mutable tag is
      # exactly what one's push could overwrite between the other's push and its pull. The hash is
      # the archetype's derivation (release-archetypes/daemon.yml's header argues it): this tree's
      # toolchain gets a tag of its own that nothing else pushes, and the QA and release phases of
      # one tree still land on the same tag, so the native compile stays a cache hit.
      builder_tag=$( { cat docker/Dockerfile.musl-builder; printf '%s\n%s\n' "$musl_url" "$zlib_url"; } | sha256sum | cut -c1-16 )
      builder="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/graalvmce-musl-builder:jdk-25-$builder_tag"
      buildctl build --frontend dockerfile.v0 \
        --local context=docker --local dockerfile=docker \
        --opt filename=Dockerfile.musl-builder \
        --opt build-arg:MUSL_URL="$musl_url" \
        --opt build-arg:ZLIB_URL="$zlib_url" \
        $tarball_auth \
        --output "type=image,name=$builder,push=true"
      # BYTE-IDENTICAL TO THE RELEASE SLOT'S IMAGE BUILD but for the output. Change one, change the
      # other. The image is exported as a docker archive and loaded into the step's own docker rather
      # than pushed: nothing is published from a fold, and a QA tag in the registry would be one
      # more coordinate for the GC to reason about.
      qa_ref="qits-ci-runner:qa-${QITS_CI_SHA:-local}"
      mkdir -p out
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=image \
        --opt build-arg:BUILDER_IMAGE="$builder" \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=docker,name=$qa_ref,dest=out/qits-ci-runner.tar"
      docker load -i out/qits-ci-runner.tar
      # THE VERSION PROBE: the binary in the image names the version this tree carries — the one
      # the jar beside it will pin, and the one a runner says in its Hello. Answered before Quarkus
      # starts, so stdout is exactly that one line.
      expected=$(sed -n 's:^    <version>\(.*\)</version>$:\1:p' pom.xml | head -1)
      printed=$(docker run --rm -e QITS_CI_RUNNER_PRINT_VERSION=1 "$qa_ref")
      [ -n "$expected" ] && [ "$printed" = "$expected" ] || {
        echo "the image printed version '$printed', the tree carries '$expected'" >&2
        docker rmi "$qa_ref" >/dev/null 2>&1 || true
        exit 1
      }
      # THE NO-ENVIRONMENT PROBE: the one line an operator who ran the image bare gets, exit 2. The
      # suite cannot see a SmallRye startup failure; this can.
      code=0
      docker run --rm "$qa_ref" >/dev/null 2>&1 || code=$?
      docker rmi "$qa_ref" >/dev/null 2>&1 || true
      [ "$code" = 2 ] || { echo "the runner image started with no environment exited $code, expected 2" >&2; exit 1; }
      echo "qits-ci-runner image built: version $printed"

  # THE INSTALL-SCRIPT CONTRACT (qits-464). qits-ci renders the script a person pastes on a runner
  # host from its own template; scripts/fixtures/runner-install.sh is the reference rendering that
  # template matches, and this step runs it offline with a stub docker on PATH that records its argv.
  # It asserts the container contract — see the script's header. Nothing here needs docker or a
  # network.
  - image: qits/build-images/ci-base:latest
    timeout-seconds: 300
    script: |
      sh scripts/test-install-contract.sh

# THE RELEASE HALF: two artifacts of two kinds leave this tree. The first step pushes the image; the
# second is the pin-and-protocol jar, deliberately AFTER the push — the jar is what tells qits-ci
# which image to hand out, so a jar that resolves before its image is in the registry is a pin
# pointing at nothing.
release:
  - image: qits/build-images/ci-base:latest
    build: true
    timeout-seconds: 3600
    script: |
      # THE ADDRESSES ARE CODE (qits-731): see the QA step's comment. `wohlben.eu` covers a qits-ci
      # too old to inject $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      maven_root="https://registry.qits.$qits_domain/artifacts/maven/maven"
      musl_url=$(sed -n 's/^ARG MUSL_URL=//p' docker/Dockerfile.musl-builder)
      zlib_url=$(sed -n 's/^ARG ZLIB_URL=//p' docker/Dockerfile.musl-builder)
      : "${musl_url:?docker/Dockerfile.musl-builder declares no ARG MUSL_URL}"
      : "${zlib_url:?docker/Dockerfile.musl-builder declares no ARG ZLIB_URL}"
      musl_url="$maven_root${musl_url#*/artifacts/maven/maven}"
      zlib_url="$maven_root${zlib_url#*/artifacts/maven/maven}"
      # The QA step's tarball credential, byte for byte: the run's token on the EDGE plane only.
      tarball_auth=
      if [ -n "${QITS_TOKEN:-}" ]; then
        tarball_host=$(printf '%s\n' "$maven_root" | sed -E 's|^[A-Za-z]+://||; s|[/:?].*$||')
        tarball_auth="--secret id=HTTP_AUTH_TOKEN_$tarball_host,env=QITS_TOKEN"
      fi
      # The QA step's derivation, byte for byte: the same tree names the same tag in both phases,
      # so BUILDER_IMAGE is the same string and the native compile below is a cache hit.
      builder_tag=$( { cat docker/Dockerfile.musl-builder; printf '%s\n%s\n' "$musl_url" "$zlib_url"; } | sha256sum | cut -c1-16 )
      builder="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/graalvmce-musl-builder:jdk-25-$builder_tag"
      buildctl build --frontend dockerfile.v0 \
        --local context=docker --local dockerfile=docker \
        --opt filename=Dockerfile.musl-builder \
        --opt build-arg:MUSL_URL="$musl_url" \
        --opt build-arg:ZLIB_URL="$zlib_url" \
        $tarball_auth \
        --output "type=image,name=$builder,push=true"
      # THE QA PIPELINE'S IMAGE BUILD, BYTE FOR BYTE but for the output: `push=true` IS THE PUBLISH.
      # The image goes from the builder straight to the registry and never enters a local image
      # store.
      ref="registry.qits.$qits_domain/$QITS_IMAGE_REPOSITORY/qits-ci-runner:$QITS_VERSION"
      echo "releasing $ref"
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=image \
        --opt build-arg:BUILDER_IMAGE="$builder" \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output "type=image,name=$ref,push=true"
      # THE DOCUMENT COMES OUT OF THE SAME BUILD AS THE IMAGE — the reactor exists only in there.
      # Build args byte-identical to the push above, so every layer is a cache hit.
      #
      # GENERATED, NEVER SUBMITTED — the postlude PUTs it for the artifact that declares it.
      buildctl build --frontend dockerfile.v0 \
        --local context=. --local dockerfile=docker \
        --opt target=sbom \
        --opt build-arg:BUILDER_IMAGE="$builder" \
        --opt build-arg:QITS_DOMAIN="$qits_domain" \
        --secret id=qits-client-id,src=/tmp/qits-client-id \
        --secret id=qits-client-secret,src=/tmp/qits-client-secret \
        --output type=local,dest=out

  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      # NO LONGER A DEPLOY: the CLI publishes this coordinate from the postlude, off the jar this
      # step leaves in target/. This step only has to build it.
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl ci-runner-protocol -am package -DskipTests
      # THE ADDRESSES ARE CODE (qits-731). `wohlben.eu` covers a qits-ci too old to inject
      # $QITS_DOMAIN.
      qits_domain=${QITS_DOMAIN:-wohlben.eu}
      QITS_MAVEN_CENTRAL_URL="https://mirror.qits.$qits_domain/mirror/maven/central" \
      ./mvnw -B -ntp -s .qits-maven-settings.xml -pl ci-runner-protocol -DskipTests \
        -Dqits.maven.repository.url="https://registry.qits.$qits_domain/artifacts/maven/maven" \
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
        -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6
