# ci-runner — the pull-based executor a person installs on any Linux host with docker.
#
# The env contract, left unset on purpose so a binary started with no environment fails with one
# honest sentence naming what is missing (exit 2) instead of dialling a default. The install script
# qits-ci renders passes URL, ID, REGISTRATION_TOKEN and SLOTS to the runner's container (the state
# dir is the image's default, where the state volume is mounted); the rest are for an operator who
# has a reason, and the install script passes each one that is set.
#
#   QITS_CI_RUNNER_URL                 -> qits.ci.runner.url                  the CI service's base url
#   QITS_CI_RUNNER_ID                  -> qits.ci.runner.id                   the runner id the CI minted
#   QITS_CI_RUNNER_REGISTRATION_TOKEN  -> qits.ci.runner.registration-token   one-time; only until registered
#   QITS_CI_RUNNER_STATE_DIR           -> qits.ci.runner.state-dir            default /var/lib/qits-ci-runner
#   QITS_CI_RUNNER_SLOTS               -> qits.ci.runner.slots                advertised; the CI's Ack wins
#   QITS_CI_RUNNER_DOCKER_BINARY       -> qits.ci.runner.docker-binary        default docker
#   QITS_CI_RUNNER_DOCKER_TIMEOUT      -> qits.ci.runner.docker-timeout       seconds per docker call, default 120
#   QITS_CI_RUNNER_BUILDKIT_IMAGE      -> qits.ci.runner.buildkit-image       default moby/buildkit:v0.33.0
#   QITS_CI_RUNNER_BUILDKIT_HTTP_REGISTRIES  -> qits.ci.runner.buildkit-http-registries   host[:port],… default empty
#   QITS_CI_RUNNER_BUILDKIT_REGISTRY_MIRRORS -> qits.ci.runner.buildkit-registry-mirrors  from=to,…     default empty
#   QITS_CI_RUNNER_BUILDKIT_STATE_VOLUME     -> qits.ci.runner.buildkit-state-volume      default qits-buildkitd-state
#   QITS_CI_RUNNER_BUILDKIT_MAX_PARALLELISM  -> qits.ci.runner.buildkit-max-parallelism   concurrent builds, default 1
#   QITS_CI_RUNNER_ROLLOVER_TIMEOUT    -> qits.ci.runner.rollover-timeout     seconds a successor has to take over, default 180
#   QITS_CI_RUNNER_SELF_UPDATE         -> qits.ci.runner.self-update          true|false, default true; false = deployer-managed
#
# `qits-ci-runner health` (the explicit first argument) is the container healthcheck: it reads
# QITS_CI_RUNNER_STATE_DIR raw, checks the heartbeat file's age and exits before Quarkus starts.
#
# And two read raw by Main itself: QITS_CI_RUNNER_PRINT_VERSION=1 prints the version and exits 0 (the
# image's smoke probe), before Quarkus starts; QITS_CI_RUNNER_TELEMETRY_URL is the OTLP endpoint the
# runner's log is shipped to — unset derives https://observability.<domain>/observability/api/otel
# from a https://ci.<domain> url, and set-but-empty switches it off, a difference SmallRye cannot see.
#
# Every one of these is Optional<String> in Main and parsed by RunnerEnv. An empty `defaultValue` is
# not a default — SmallRye reads defaultValue="" as *no value* and the binary dies at startup with
# "Failed to load config value of type class java.lang.String".

# Liveness ping cadence, and the reconnect backoff: 500ms doubling to a 30s cap, forever.
qits.ci.runner.heartbeat-interval-ms=10000
qits.ci.runner.reconnect-initial-backoff-ms=500
qits.ci.runner.reconnect-max-backoff-ms=30000

# The register door and the token endpoint: connect and idle timeout per call.
qits.ci.runner.http-timeout-ms=30000

# Name the compiled artifact `qits-ci-runner`: the image puts it at /usr/local/bin/qits-ci-runner and
# makes it the entrypoint, so it is what `ps` shows.
quarkus.package.output-name=qits-ci-runner
quarkus.package.jar.add-runner-suffix=false

# Lean and quiet: the container's log IS the operator's view of this process (`docker logs -f
# qits-ci-runner-…`), so what is logged matters and a banner is noise in it.
quarkus.log.level=INFO
quarkus.banner.enabled=false

# The runner dials https (the register door, the token endpoint) and wss (the socket) through the
# platform's edge, so the native image must carry TLS. Explicit rather than left to an extension's
# opinion: without it a native build can link no SSL at all and the first dial fails at runtime.
quarkus.ssl.native=true

# --- the shipping form: a fully static musl native image -------------------------------------------
# qits-ci-daemon's settings, unchanged, and each line load-bearing for the reasons its
# application.properties gives: the musl toolchain lives only in the builder image; that image is
# local-only (hence pull=missing — and NOT the silently ignored quarkus.native.pull-always); and
# --static --libc=musl is the point, because a runner host is whatever Linux a person had.
quarkus.native.container-build=true
quarkus.native.builder-image=qits/graalvmce-musl-builder:jdk-25
quarkus.native.builder-image.pull=missing
quarkus.native.additional-build-args=--static,--libc=musl
